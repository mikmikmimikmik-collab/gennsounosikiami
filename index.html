<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幻想の四季編み</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Noto+Serif+JP:wght@200;300&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            background-color: #0c0c0c;
            color: #e5e5e5;
            font-family: 'Cormorant Garamond', 'Noto Serif JP', serif;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* タイトル・ファーストビューセクション */
        .hero {
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            padding: 0 20px;
        }

        .hero h1 {
            font-size: clamp(2.5rem, 6vw, 5rem);
            font-weight: 300;
            letter-spacing: 0.15em;
            margin-bottom: 1.5rem;
            color: #f5f5f5;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .hero p {
            font-size: clamp(0.9rem, 1.5vw, 1.2rem);
            letter-spacing: 0.25em;
            color: #888;
            font-weight: 300;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 1.5s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
        }

        /* Scrollインジケーター（完全に真ん中に修正） */
        .scroll-indicator {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            opacity: 0;
            animation: fadeIn 1.5s ease 0.8s forwards;
        }

        .scroll-indicator span {
            font-size: 0.75rem;
            letter-spacing: 0.3em;
            color: #666;
            text-transform: uppercase;
        }

        .scroll-line {
            width: 1px;
            height: 40px;
            background: linear-gradient(to bottom, #666, transparent);
            animation: pulseLine 2s infinite;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulseLine {
            0% { transform: scaleY(0); transform-origin: top; }
            50% { transform: scaleY(1); transform-origin: top; }
            50.1% { transform: scaleY(1); transform-origin: bottom; }
            100% { transform: scaleY(0); transform-origin: bottom; }
        }

        /* 写真セクション */
        .gallery {
            display: flex;
            flex-direction: column;
            gap: 22vh;
            padding: 15vh 0 25vh 0;
            max-width: 1400px;
            margin: 0 auto;
        }

        .gallery-item {
            width: 100%;
            height: 85vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 5vw;
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .gallery-item.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .gallery-item img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: brightness(0.95);
            transition: filter 0.5s ease;
        }

        .gallery-item img:hover {
            filter: brightness(1);
        }

        /* フッター */
        footer {
            text-align: center;
            padding: 100px 20px 120px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        footer .footer-brand {
            font-size: 1.1rem;
            letter-spacing: 0.25em;
            color: #aaa;
            font-weight: 300;
        }

        footer .instagram-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #888;
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 0.15em;
            transition: color 0.3s ease;
        }

        footer .instagram-link:hover {
            color: #ffffff;
        }

        footer .instagram-icon {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        footer .footer-copy {
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            color: #555;
            margin-top: 8px;
        }

        @media (max-width: 768px) {
            .gallery {
                gap: 18vh;
            }
            .gallery-item {
                height: 70vh;
                padding: 0 4vw;
            }
        }
    </style>
</head>

    <script>
        // スクロールに応じたフェードイン効果
        const observerOptions = {
            root: null,
            rootMargin: '0px',
            threshold: 0.15
        };

        const observer = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, observerOptions);

        document.querySelectorAll('.gallery-item').forEach(item => {
            observer.observe(item);
        });
    </script>
